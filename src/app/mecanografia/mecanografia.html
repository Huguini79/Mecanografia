<style>
    :host
    {
        font-size: 40px;
    }
</style>

{{ contador }}
<br>
<label style="color: green;">Correctas: {{ correctas_de_frase_actual }} </label>
<label style="color: red;">| Incorrectas: {{ incorrectas_de_frase_actual }}</label>
<br><br>
{{ yeaah }}

<p>Escribe esta frase:</p>
@for (letra of frase_array; track letra)
{
    @if (letra.complete == true)
    {
        <label style="color: green;">{{ letra.char }}</label>
    
    } @else if (letra.complete == false)
    {
        <label style="color: blue;">{{ letra.char }}</label>
    
    } @else
    {
        <label style="color: red;">{{ letra.char }}</label>
    }
}

<br><br>
<textarea id="textarea" style="height: 300px; width: 500px;" (keydown)="teclaPresionada($event)"></textarea>
<br>
<button (click)="Anterior()">Anterior frase</button>
<button (click)="Siguiente()">Siguiente frase</button>
